name: AI Skin Intelligence CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =========================================================
  # 1. BACKEND AUTOMATED TESTING & VALIDATION
  # =========================================================
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skin_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skin_intelligence_test
          SECRET_KEY: test-secret-key-ci-cd-12345
          PYTHONPATH: backend
        run: |
          pytest -v backend/tests

  # =========================================================
  # 2. FRONTEND PRODUCTION BUILD VALIDATION
  # =========================================================
  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle (Vite)
        run: |
          cd frontend
          npm run build

  # =========================================================
  # 3. DOCKER CONTAINER VERIFICATION
  # =========================================================
  docker-build:
    name: Docker Container Validation
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker images
        run: |
          docker compose build --parallel

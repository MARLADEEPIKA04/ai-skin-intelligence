version: '3.8'

services:
  # =========================================================
  # POSTGRESQL DATABASE
  # =========================================================
  db:
    image: postgres:16-alpine
    container_name: skin_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skin_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skin_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # FASTAPI BACKEND SERVICE
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin_intel_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-skin_intelligence}
      SECRET_KEY: ${SECRET_KEY:-skin-intelligence-secret-key-2024}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  # =========================================================
  # REACT / VITE NGINX FRONTEND
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin_intel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
